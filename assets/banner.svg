  <circle cx="1080" cy="60" r="4" fill="#61DAFB" opacity="0.8"/>
  <circle cx="1130" cy="120" r="3" fill="#F7DF1E" opacity="0.7"/>
  <circle cx="1000" cy="200" r="5" fill="#00599C" opacity="0.6"/>
  <circle cx="1150" cy="220" r="3" fill="#4169E1" opacity="0.7"/>
  <circle cx="60" cy="40" r="3" fill="#239120" opacity="0.6"/>
  <circle cx="120" cy="230" r="4" fill="#26A5E4" opacity="0.6"/>

  <text x="90" y="140" font-family="'Segoe UI', Arial, sans-serif" font-size="52" font-weight="700" fill="#F5F7FA">
    Hey there, I'm Nazarii <tspan font-size="48">👋</tspan>
  </text>
  <text x="92" y="182" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="400" fill="#9FB3C8">
